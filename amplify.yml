version: 1
# Optional static-build recipe only. Hosting access is not assumed in Learner Lab.
# This file must never provision a backend or request IAM roles.
applications:
  - appRoot: frontend
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - cd "$(git rev-parse --show-toplevel)"
            - nvm use 24
            - node --version
            - test "$AWS_BRANCH" = main
            - npm ci --include=dev --cache .npm --prefer-offline
            - npm run typecheck
            - npm run test:auth
            - npm run test:legacy-api
        build:
          commands:
            - npm run build -w frontend
      artifacts:
        baseDirectory: frontend/dist
        files:
          - '**/*'
      cache:
        paths:
          - .npm/**/*
